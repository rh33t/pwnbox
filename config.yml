---
baremetal: false

system_timezone: "Africa/Porto-Novo"

# kali rolling has no docker repo of its own, so track a debian stable suite
docker_distribution: "trixie"

uv_releases_url: "https://api.github.com/repos/astral-sh/uv/releases/latest"
uv_download_url: "https://github.com/astral-sh/uv/releases/download"

go_releases_url: "https://go.dev/dl/?mode=json"

nvim_repo_url: "https://github.com/neovim/neovim.git"
nvim_build_dir: "/tmp/neovim"
nvim_build_type: "RelWithDebInfo"

fonts:
  - name: "JetBrainsMono"
    url: "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.2.1/JetBrainsMono.zip"
    dir: "/usr/share/fonts/truetype/jetbrains-mono-nerd"
  - name: "Roboto"
    url: "https://github.com/googlefonts/roboto/releases/download/v2.138/roboto-android.zip"
    dir: "/usr/share/fonts/truetype/roboto"
temp_base_dir: "/tmp/font-downloads"

