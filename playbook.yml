---
- name: setup hacking environment
  hosts: localhost
  connection: local
  vars_files:
    - config.yml

  pre_tasks:
  - name: check the distribution is supported
    assert:
      that: "'Kali' in ansible_facts['distribution']"
      fail_msg: "{{ ansible_facts['distribution'] }} is not supported; this build targets Kali."
    tags: always

  tasks:
  - import_tasks: tasks/system.yml
    tags: system
  - import_tasks: tasks/packages.yml
    tags: [tools, packages]
  - import_tasks: tasks/docker.yml
    tags: [tools, docker]
  - import_tasks: tasks/go.yml
    tags: [tools, golang]
  - import_tasks: tasks/uv.yml
    tags: [tools, uv]
  - import_tasks: tasks/nvim.yml
    tags: [tools, nvim]
  - import_tasks: tasks/binaryninja.yml
    tags: [tools, binaryninja]
  - import_tasks: tasks/shelf.yml
    tags: [tools, shelf]
  - import_tasks: tasks/vscode.yml
    tags: [tools, vscode]
  - import_tasks: tasks/wireshark.yml
    tags: [tools, wireshark]
  - import_tasks: tasks/burp-firefox.yml
    tags: [burp, firefox]
  - import_tasks: tasks/fonts.yml
    tags: fonts
  - import_tasks: tasks/dotfiles.yml
    tags: dotfiles
  - name: drop the downloaded package archives
    apt:
      clean: true
    become: true
    tags: [tools, packages]
