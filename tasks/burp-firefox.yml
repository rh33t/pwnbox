---
- name: "Check if burpsuite-ca.der exists"
  stat:
    path: /usr/local/share/ca-certificates/burpsuite-ca.der
  register: burp_cert
  
- name: "Copying Burp Script"
  copy:
    src: getburpcert.sh
    dest: /tmp/getburpcert.sh
    mode: 0744
  when: burp_cert.stat.exists == False

- name: "Executing bash script to Download CA Certificate"
  shell:
    /tmp/getburpcert.sh
  when: burp_cert.stat.exists == False

- name: "Copying CA Certificate to /usr/local/share/ca-certificates"
  copy:
    src: /tmp/cacert.der
    dest: /usr/local/share/ca-certificates/burpsuite-ca.der
    owner: root
    group: root
    mode: 0644
  become: true
  become_method: sudo
  when: burp_cert.stat.exists == False

- name: "Finding Firefox installations"
  find:
    paths: /usr/share
    patterns: "firefox*"
    file_type: directory
    recurse: false
  register: firefox_dirs

# created rather than probed, or a build lacking the directory is skipped silently
- name: "Ensuring Firefox distribution directories exist"
  file:
    path: "{{ item.path }}/distribution"
    state: directory
    mode: '0755'
  loop: "{{ firefox_dirs.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  become_method: sudo

- name: "Updating Firefox Policies"
  copy:
    src: firefox-policies.json
    dest: "{{ item.path }}/distribution/policies.json"
  loop: "{{ firefox_dirs.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  become_method: sudo

- name: "Warn when no Firefox installation was found"
  debug:
    msg: "no /usr/share/firefox* directory found, policies not deployed"
  when: firefox_dirs.files | length == 0
