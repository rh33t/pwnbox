---
- name: ensure fontconfig & unzip is installed
  apt:
    name:
      - fontconfig
      - unzip
    state: present
  become: true

- name: check if fonts are already installed
  stat:
    path: "{{ item.dir }}"
  register: fonts_installed
  loop: "{{ fonts }}"
  loop_control:
    label: "{{ item.name }}"

# creating and deleting the scratch dir on every run would always report changed
- name: set whether any font is missing
  set_fact:
    fonts_missing: "{{ fonts_installed.results | selectattr('stat.exists', 'equalto', false) | list | length > 0 }}"

- name: create temporary download directory
  file:
    path: "{{ temp_base_dir }}"
    state: directory
    mode: "0755"
  when: fonts_missing

- name: create system font directories
  file:
    path: "{{ item.item.dir }}"
    state: directory
    mode: "0755"
  when: not item.stat.exists
  loop: "{{ fonts_installed.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  become: true

- name: download font packages
  get_url:
    url: "{{ item.item.url }}"
    dest: "{{ temp_base_dir }}/{{ item.item.name }}.zip"
    mode: "0644"
    timeout: 30
  when: not item.stat.exists
  loop: "{{ fonts_installed.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: extract font files
  unarchive:
    src: "{{ temp_base_dir }}/{{ item.item.name }}.zip"
    dest: "{{ item.item.dir }}"
    remote_src: true
    include: "*.ttf"
    extra_opts: ["-j"]
  when: not item.stat.exists
  loop: "{{ fonts_installed.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  become: true

- name: update font cache
  command: fc-cache -f -v
  when: fonts_missing
  changed_when: true
  become: true

- name: clean up temporary files
  file:
    path: "{{ temp_base_dir }}"
    state: absent
  when: fonts_missing
