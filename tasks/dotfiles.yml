---
- name: copy dotfiles into the home directory
  copy:
    src: "{{ playbook_dir }}/dotfiles/"
    dest: "{{ ansible_facts['env']['HOME'] }}/"
    mode: preserve

# i3 never runs the autostart entry that normally creates Desktop, Documents, Downloads and the rest
- name: create the default user directories
  command: xdg-user-dirs-update
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.config/user-dirs.dirs"

- name: create the work directory
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/work"
    state: directory
    mode: '0755'
